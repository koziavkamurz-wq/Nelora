name: Publish Sileo source mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync.py
      - name: Keep DEBs and folders visible in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Camera Utility iOS26 Icons Wallpapers Packages Packages.gz Packages.bz2 Release CydiaIcon.png .nojekyll
          git diff --cached --quiet || git commit -m 'Update published DEBs and Sileo indexes'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
